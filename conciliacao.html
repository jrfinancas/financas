<script>
// ============================================================
// Finanças JR · Conciliação bancária
//
// Nasceu em 31/out/2026, depois da conciliacao manual de mai-jul/2026
// que esta documentada no projeto. Tres licoes daquele trabalho estao
// embutidas no casamento, e cada uma derruba o casamento ingenuo:
//
//   1. TOLERANCIA DE CENTAVOS. A fatura do Master de junho era
//      R$ 6.487,59 no banco e R$ 6.487,61 no app. Casamento por valor
//      exato trata isso como duas linhas erradas em vez de uma certa.
//   2. UMA LINHA DO BANCO = VARIAS DO APP. A Claro vem R$ 303,70 no
//      extrato e como R$ 119,90 + R$ 94,90 no app. O condominio idem.
//      O holerite e o caso extremo: bruto mais descontos contra um TED.
//   3. JANELA DE DIAS. O app lanca com data diferente do banco direto.
//      Casamento por data exata errou 52 de 72 linhas em junho.
// ============================================================

const SB='https://tggtktjblunlbsjbhlls.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRnZ3RrdGpibHVubGJzamJobGxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyODM0MTksImV4cCI6MjA5MTg1OTQxOX0.POdSpd63K5WfCoLWn0LwqSm5SFRTOSEukLGRExCrP_o';
const SBH={'apikey':KEY,
  get 'Authorization'(){ return 'Bearer '+((window.JRAuth&&JRAuth.token())||KEY); },
  'Content-Type':'application/json','Prefer':'return=representation'};
const APP_VERSION='v2026.11.02-d';

// mesmo sbGet paginado das outras telas (teto de 1000 linhas da API)
async function sbGet(t, q='') {
  const PAG = 1000;
  const lim = q.match(/(^|&)limit=(\d+)/);
  if (/(^|&)offset=\d+/.test(q) || (lim && +lim[2] <= PAG)) {
    const r = await fetch(`${SB}/rest/v1/${t}?${q}`, {headers: SBH});
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }
  let base = q.replace(/(^|&)limit=\d+/g, '').replace(/^&+/, '');
  const m = base.match(/(^|&)order=([^&]*)/);
  if (!m) base = base ? base + '&order=id.asc' : 'order=id.asc';
  else if (!/\bid\b/.test(m[2]))
    base = base.replace(/((^|&)order=)([^&]*)/, '$1$3,id.asc');
  let off = 0, tudo = [];
  for (;;) {
    const r = await fetch(`${SB}/rest/v1/${t}?${base}&limit=${PAG}&offset=${off}`, {headers: SBH});
    if (!r.ok) throw new Error(await r.text());
    const lote = await r.json();
    tudo = tudo.concat(lote);
    if (lote.length < PAG) return tudo;
    off += PAG;
  }
}
async function sbIns(t,d){const r=await fetch(`${SB}/rest/v1/${t}`,{method:'POST',headers:SBH,body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbUpd(t,id,d){const r=await fetch(`${SB}/rest/v1/${t}?id=eq.${id}`,{method:'PATCH',headers:SBH,body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r.json();}
// Grava substituindo a linha que ja existir na chave unica. Um casamento
// refeito na mesma linha do extrato tem de sobrescrever, nao duplicar.
async function sbUpsert(t,d,chave){
  const h=Object.assign({},SBH,{'Prefer':'return=representation,resolution=merge-duplicates'});
  const r=await fetch(`${SB}/rest/v1/${t}?on_conflict=${chave}`,{method:'POST',headers:h,body:JSON.stringify(d)});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function sbDel(t,q){
  const r=await fetch(`${SB}/rest/v1/${t}?${q}`,{method:'DELETE',headers:SBH});
  if(!r.ok)throw new Error(await r.text());
  return true;
}

function toast(msg,bg,col){const t=document.getElementById('toast');t.textContent=msg;t.style.background=bg||'var(--green)';t.style.color=col||'#0d0f14';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmt(v){return parseFloat(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtD(d){ if(!d) return ''; const p=String(d).slice(0,10).split('-'); return p[2]+'/'+p[1]; }
// Com ano. O fmtD sem ano serve para as linhas de um extrato, onde o ano e
// obvio. No registro da conciliacao nao e: "extrato ate 24/10" lido em
// marco nao diz de que ano, e e justamente a data de partida do proximo.
function fmtDA(d){ if(!d) return ''; const p=String(d).slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function hoje(){ return new Date().toISOString().slice(0,10); }

// ============================================================
// LEITURA DO CSV
// ============================================================

// O Santander manda a descricao entre aspas COM quebra de linha dentro,
// entao um registro ocupa varias linhas fisicas. Cortar por \n antes de
// tratar as aspas — que e o que o importar-quicken.html faz — quebra o
// arquivo. Este tokenizador percorre caractere a caractere.
function lerCSV(texto, sep){
  texto = texto.replace(/^\uFEFF/, '');          // BOM do UTF-8
  texto = texto.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const linhas = []; let campos = [], campo = '', aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) {
      if (c === '"') {
        if (texto[i+1] === '"') { campo += '"'; i++; }   // aspas escapada
        else aspas = false;
      } else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === sep) { campos.push(campo); campo = ''; }
    else if (c === '\n') { campos.push(campo); linhas.push(campos); campos = []; campo = ''; }
    else campo += c;
  }
  if (campo !== '' || campos.length) { campos.push(campo); linhas.push(campos); }
  return linhas;
}

function valorBR(s){
  if (s == null) return NaN;
  let t = String(s).trim();
  if (!t) return NaN;
  const negDepois = /-\s*$/.test(t);              // o PDF/alguns CSV poem o - no fim
  t = t.replace(/[R$\s]/g, '').replace(/-/g, '');
  t = t.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(t);
  if (isNaN(n)) return NaN;
  const neg = negDepois || /^-/.test(String(s).trim());
  return neg ? -n : n;
}

function dataBR(s){
  const m = String(s||'').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return null;
  return m[3] + '-' + m[2] + '-' + m[1];
}

// Acha o cabecalho em qualquer lugar do arquivo e devolve os lancamentos.
// Nao assume numero de linhas de preambulo: procura a linha que tem
// Data e Valor.
function parseExtrato(texto){
  for (const sep of [';', ',', '\t']) {
    const linhas = lerCSV(texto, sep);
    let hi = -1, iData = -1, iVal = -1, iDesc = -1, iSaldo = -1;
    for (let i = 0; i < Math.min(linhas.length, 40); i++) {
      const L = linhas[i].map(x => x.trim().toLowerCase());
      const d = L.findIndex(x => x === 'data');
      const v = L.findIndex(x => /^valor/.test(x) || /^movimento/.test(x));
      if (d >= 0 && v >= 0) {
        hi = i; iData = d; iVal = v;
        iDesc = L.findIndex(x => /descri|hist[oó]rico|lan[çc]amento/.test(x));
        iSaldo = L.findIndex(x => /^saldo/.test(x));
        break;
      }
    }
    if (hi < 0) continue;
    const out = [];
    for (let i = hi + 1; i < linhas.length; i++) {
      const c = linhas[i];
      if (!c || c.length <= Math.max(iData, iVal)) continue;
      const data = dataBR(c[iData]);
      const valor = valorBR(c[iVal]);
      if (!data || isNaN(valor)) continue;
      out.push({
        data, valor,
        desc: iDesc >= 0 ? String(c[iDesc]||'').replace(/\s+/g,' ').trim() : '',
        saldo: iSaldo >= 0 ? valorBR(c[iSaldo]) : NaN
      });
    }
    if (out.length) return { linhas: out, sep, periodo: achaPeriodo(linhas, hi) };
  }
  return { linhas: [], sep: null, periodo: null };
}

// O periodo que o BANCO diz ter entregado, do preambulo do CSV:
//   Período do extrato;27/07/2026 a 24/10/2026
// Deduzir o periodo das datas dos lancamentos erra para dentro: neste
// arquivo o ultimo movimento e 22/10, mas o extrato cobre ate 24/10. A
// diferenca nao e so cosmetica — o periodo define a janela em que um
// lancamento do app sem par no banco conta como divergencia. Com a janela
// curta, lancamento do app em 23 ou 24/10 ficava invisivel.
function achaPeriodo(linhas, hi){
  for (let i = 0; i < Math.min(hi >= 0 ? hi : linhas.length, 40); i++) {
    const texto = (linhas[i] || []).join(' ');
    if (!/per[ií]odo/i.test(texto)) continue;
    const datas = texto.match(/\d{2}\/\d{2}\/\d{4}/g);
    if (datas && datas.length >= 2) {
      const ini = dataBR(datas[0]), fim = dataBR(datas[1]);
      if (ini && fim && ini <= fim) return { ini, fim };
    }
  }
  return null;
}

// ============================================================
// O CASAMENTO
// ============================================================

function dias(a, b){ return Math.abs((new Date(a+'T00:00:00') - new Date(b+'T00:00:00')) / 86400000); }

// Monta os candidatos do lado do app. O que o banco mostra como UMA
// linha vira UM candidato, com a soma liquida.
//
// Sao DOIS agrupamentos, nao um:
//   - group_id, que o lancamento dividido grava;
//   - is_payslip + payslip_month, que e como o HOLERITE se identifica.
//     A aba Holerite nao grava group_id (lancamentos.html ~2475): as
//     linhas so compartilham is_payslip e payslip_month. Agrupar apenas
//     por group_id deixava o salario solto e o TED nunca casava.
//     Conferido em set/26: 18.000 − 1,00 − 35,00 − 988,07 − 7.069,55
//     = 9.906,38, exatamente o TED do extrato de 30/09.
function montaCandidatos(txs){
  const soltos = [], grupos = {};
  function chaveGrupo(t){
    if (t.group_id) return 'g' + t.group_id;
    if (t.is_payslip && t.payslip_month) return 'h' + t.payslip_month + '|' + (t.account || '');
    return null;
  }
  txs.forEach(t => {
    const v = (t.type === 'income' ? 1 : -1) * parseFloat(t.amount || 0);
    const k = chaveGrupo(t);
    if (k) {
      const g = grupos[k] || (grupos[k] = {ids:[], data:t.date, valor:0, desc:'', n:0, conciliado:true, grupo:true});
      g.ids.push(t.id); g.valor += v; g.n++;
      if (t.date < g.data) g.data = t.date;
      if (!g.desc) g.desc = (t.payee_display || t.payee || '');
      if (!t.reconciled) g.conciliado = false;
    } else soltos.push({ ids:[t.id], data:t.date, valor:v,
                         desc:(t.payee_display || t.payee || ''), n:1,
                         conciliado: !!t.reconciled });
  });
  const todos = soltos.concat(Object.values(grupos));
  // o lancamentos.html grava group_id em TODO lancamento, inclusive nos de
  // uma linha — entao sem o n>1 quase tudo saia como "(1 linhas)"
  todos.forEach(c => { if (c.grupo && c.n > 1) c.desc = c.desc + ' (' + c.n + ' linhas)'; });
  return todos;
}

function casar(banco, cand, TOL, JAN, MAO){
  // A marca de "ja casou" fica na propria linha do extrato. Limpar isso
  // era tarefa de quem chamava — e uma segunda chamada sem a limpeza
  // devolvia um resultado errado, sem erro nenhum. Agora e aqui.
  banco.forEach(b => { delete b._ok; });
  const usados = new Set();
  const pares = [];
  const livres = () => cand.filter((c,i) => !usados.has(i));
  const idx = c => cand.indexOf(c);

  // Um casamento tem N linhas de cada lado. Comecou com uma do banco
  // contra varias do app, mas o inverso existe: em 03/ago o extrato traz
  // IOF em duas linhas (-1,46 e -0,08) e o app tem uma so de -1,54.
  function fecha(bls, cs, nota){
    bls.forEach(b => { b._ok = 1; });
    cs.forEach(c => usados.add(idx(c)));
    pares.push({ bancos: bls, apps: cs, nota });
  }

  // PASSE 0 — os casamentos que voce ja fez a mao, em qualquer rodada.
  //
  // Vem antes de tudo: foi decisao sua, nao chute do motor. Sem este
  // passe, toda nova rodada refazia o casamento do zero e o par se
  // desfazia — a ponta do app voltava com o selo "ja conciliado" e a do
  // extrato voltava como "falta lancar", convidando a lancar duplicado.
  const M = MAO || {};
  banco.forEach(bl => {
    if (bl._ok) return;
    const reg = M[fpBanco(bl)];
    const ids = reg && reg.ids;
    if (!ids || !ids.length) return;
    const cs = cand.filter((c, i) => !usados.has(i) && c.ids.some(id => ids.indexOf(id) >= 0));
    if (!cs.length) return;                    // o lancamento foi apagado depois
    const dv = Math.abs(bl.valor - cs.reduce((s, c) => s + c.valor, 0));
    fecha([bl], cs, dv >= 0.005 ? 'à mão · difere R$ ' + fmt(dv) : 'à mão');
  });

  // PASSE 1 — data e valor batendo na mosca
  banco.forEach(bl => {
    if (bl._ok) return;
    const c = livres().find(c => c.data === bl.data && Math.abs(c.valor - bl.valor) < 0.005);
    if (c) fecha([bl], [c], 'exato');
  });

  // PASSE 2 — valor dentro da tolerancia, data dentro da janela.
  //
  // O melhor par do CONJUNTO primeiro, nao linha a linha. A versao
  // anterior resolvia banco por banco, e com nove PIX de R$ 146,63 no
  // mesmo periodo a primeira linha levava o candidato que uma linha
  // posterior precisava mais — sobrava uma no extrato e outra no app,
  // ambas certas. Agora todas as duplas viaveis sao ordenadas por
  // diferenca de valor e depois por distancia de data, e consumidas
  // nessa ordem.
  const arestas = [];
  banco.forEach((bl, bi) => {
    if (bl._ok) return;
    cand.forEach((c, ci) => {
      if (usados.has(ci)) return;
      const dv = Math.abs(c.valor - bl.valor), dd = dias(c.data, bl.data);
      if (dv <= TOL && dd <= JAN) arestas.push({ bi, ci, dv, dd });
    });
  });
  arestas.sort((a, b) => (a.dv - b.dv) || (a.dd - b.dd));
  arestas.forEach(e => {
    const bl = banco[e.bi];
    if (bl._ok || usados.has(e.ci)) return;
    fecha([bl], [cand[e.ci]],
      e.dv >= 0.005 ? ('difere R$ ' + fmt(e.dv)) : (e.dd ? ('data ' + e.dd + 'd') : 'exato'));
  });

  // PASSE 3 — soma de 2 a 4 lancamentos do app contra uma linha do banco.
  // Quatro, nao tres: a Claro de 05/ago vem R$ 303,71 no extrato e no app
  // esta como 94,25 + 50,56 + 119,90 + 39,00. Com o teto em 3 ela nunca
  // fechava.
  function somaQueFecha(pool, alvo, maxItens){
    const n = Math.min(pool.length, 14);   // a combinacao cresce rapido
    let achado = null;
    (function rec(i, atual, soma){
      if (achado) return;
      if (atual.length >= 2 && Math.abs(soma - alvo) <= TOL) { achado = atual.slice(); return; }
      if (atual.length >= maxItens || i >= n) return;
      for (let k = i; k < n && !achado; k++) {
        atual.push(pool[k]);
        rec(k + 1, atual, soma + pool[k].valor);
        atual.pop();
      }
    })(0, [], 0);
    return achado;
  }
  banco.forEach(bl => {
    if (bl._ok) return;
    const pool = livres()
      .filter(c => dias(c.data, bl.data) <= JAN && Math.sign(c.valor) === Math.sign(bl.valor))
      .sort((a, b) => dias(a.data, bl.data) - dias(b.data, bl.data));
    if (pool.length < 2) return;
    const achado = somaQueFecha(pool, bl.valor, 4);
    if (achado) fecha([bl], achado, 'somou ' + achado.length + ' do app');
  });

  // PASSE 4 — o inverso: varias linhas do BANCO contra uma do app.
  // Em 03/ago o extrato traz o IOF separado (-1,46 adicional e -0,08
  // imposto) e no app ha um unico lancamento de -1,54. O passe 3 so
  // somava do lado do app, entao esse caso ficava nos dois quadros.
  cand.forEach((c, ci) => {
    if (usados.has(ci)) return;
    const pool = banco
      .filter(b => !b._ok && dias(b.data, c.data) <= JAN && Math.sign(b.valor) === Math.sign(c.valor))
      .sort((a, b) => dias(a.data, c.data) - dias(b.data, c.data));
    if (pool.length < 2) return;
    const achado = somaQueFecha(pool, c.valor, 4);
    if (achado) fecha(achado, [c], 'somou ' + achado.length + ' do extrato');
  });

  const porData = (a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0;
  const soBanco = banco.filter(b => !b._ok).sort(porData);
  const soApp = livres().sort(porData);

  // Para cada sobra, o candidato mais proximo do outro lado. Nao casa
  // nada — so mostra a distancia, para a tela poder sugerir. Foi o que
  // faltou no financiamento: a parcela de setembro esta no app com data
  // de 10/out e R$ 0,21 de diferenca, longe demais para casar sozinha,
  // mas obvia para quem olha.
  function maisProximo(x, outros){
    let melhor = null;
    outros.forEach(o => {
      const dv = Math.abs(o.valor - x.valor), dd = dias(o.data, x.data);
      const peso = dv * 100 + dd;      // centavo pesa como um dia
      if (!melhor || peso < melhor.peso) melhor = { o, dv, dd, peso };
    });
    return melhor;
  }
  soBanco.forEach(b => { b._perto = maisProximo(b, soApp); });
  soApp.forEach(a => { a._perto = maisProximo(a, soBanco); });

  return { pares, soBanco, soApp };
}

let CONTAS = [], CATS = [], PAYEES = [], EXTRATO = [], TXS = [], RES = null, CONTA = null;
let PERIODO = null;   // o periodo que o banco diz ter entregado, do preambulo do CSV
// A janela do extrato era recalculada em seis lugares, cada um pelas datas
// dos lancamentos. Agora e uma conta so, e ela prefere o periodo declarado
// pelo banco — que e mais largo e e o que de fato foi conciliado.
function janela(){
  if (PERIODO && PERIODO.ini && PERIODO.fim) return { de: PERIODO.ini, ate: PERIODO.fim };
  if (!EXTRATO.length) return { de: null, ate: null };
  return {
    de:  EXTRATO.reduce((a,x)=> x.data < a ? x.data : a, EXTRATO[0].data),
    ate: EXTRATO.reduce((a,x)=> x.data > a ? x.data : a, EXTRATO[0].data)
  };
}
let TOL = 0.05, JAN = 5;

async function carregar(){
  try{
    CONTAS = await sbGet('contas','order=ordem.asc');
    const sel = document.getElementById('cConta');
    const uteis = CONTAS.filter(c => c.tipo !== 'cartao');
    sel.innerHTML = uteis.map(c => `<option value="${esc(c.id)}">${esc(c.nome)}</option>`).join('');
    const cc = uteis.find(c => c.tipo === 'corrente');
    if (cc) sel.value = cc.id;
    CATS = await sbGet('categorias','select=categoria,subcategoria,rotulo,tipo,ativo,dedutivel&limit=2000');
    PAYEES = await sbGet('payees','select=name,category,subcategory&order=use_count.desc');
    await carregaUltimas();        // precisa de CONTAS para nomear as contas
  }catch(e){ toast('✕ '+e.message,'var(--red)','white'); }
}

// ---------- onde a ultima conciliacao parou ----------
// O que voce precisa saber ao abrir a tela: de que data partir o proximo
// extrato. Por isso este quadro vem antes do upload e nao depende dele.
// Quantos dias o proximo extrato volta atras. Nao e margem de seguranca
// solta: o banco posta no dia util seguinte, entao um lancamento do app
// num sabado so aparece no extrato na segunda — e, se o periodo fechou no
// sabado, essa linha cai no extrato SEGUINTE. Sem sobreposicao os dois
// ficam em arquivos diferentes e nunca se encontram: o lancamento do app
// vira "so no app" num período, e a linha do banco vira "falta lancar" no
// outro — convidando a lancar duplicado.
// 7 dias cobrem feriado prolongado e ainda deixam folga sobre a janela de
// casamento, que e de 5 dias.
const SOBREPOE = 7;
// De onde baixar o proximo extrato: antes do fim, nao depois.
function recomeco(d){
  const x = new Date(d + 'T00:00:00');
  x.setDate(x.getDate() - SOBREPOE);
  return x.toISOString().slice(0,10);
}
async function carregaUltimas(){
  const box = document.getElementById('cardUlt'), lista = document.getElementById('ultLista');
  try{
    // uma linha por conta: a de extrato_fim mais recente
    const rows = await sbGet('conciliacoes', 'order=extrato_fim.desc&limit=1000');
    const porConta = {};
    rows.forEach(r => { if (!porConta[r.conta_id]) porConta[r.conta_id] = r; });
    const ultimas = Object.values(porConta)
      .sort((a,b) => String(b.extrato_fim).localeCompare(String(a.extrato_fim)));
    // Esconder o quadro vazio foi erro de desenho: de fora, "nada
    // registrado ainda" e "a tela nao funciona" ficam iguais. Agora o
    // quadro aparece sempre e diz qual dos dois e.
    if (!ultimas.length){
      box.style.display = '';
      lista.innerHTML =
        '<div class="empty">Nenhuma conciliação registrada ainda.' +
        '<div class="sub2" style="margin-top:6px">Carregue o extrato, confira os casamentos e use ' +
        '<b>“Registrar esta conciliação”</b> no passo 4. A partir daí este quadro passa a dizer ' +
        'até que data você já conciliou e de que data partir o próximo extrato.</div></div>';
      return;
    }
    lista.innerHTML = ultimas.map(r => {
      const c = CONTAS.find(x => x.id === r.conta_id);
      const dif = r.diferenca == null ? null : parseFloat(r.diferenca);
      const corDif = dif === null ? '' : (Math.abs(dif) < 0.005 ? 'var(--green)' : 'var(--yellow)');
      return '<div class="lin" style="align-items:flex-start">' +
        '<span class="lin-t"><b>' + esc(c ? (c.nome||c.id) : r.conta_id) + '</b>' +
        '<div class="sub2" style="margin-top:2px">extrato até <b>' + fmtDA(r.extrato_fim) + '</b>' +
        ' · conciliado em ' + fmtDA(String(r.criado_em).slice(0,10)) + '</div>' +
        '<div class="sub2" style="color:var(--accent)">próximo extrato a partir de <b>' +
          fmtDA(recomeco(r.extrato_fim)) + '</b></div>' +
        '<div class="sub2" style="opacity:.7">os ' + SOBREPOE + ' dias de sobreposição são de propósito: ' +
          'o que o banco postar com atraso cai no mesmo arquivo e casa sozinho</div>' +
        (dif === null ? '' :
          '<div class="sub2" style="color:' + corDif + '">diferença no fechamento: R$ ' + fmt(dif) + '</div>') +
        '</span>' +
        '<span class="lin-v ' + (parseFloat(r.saldo_extrato) < 0 ? 'neg' : 'pos') + '">' +
          (r.saldo_extrato == null ? '—' : 'R$ ' + fmt(parseFloat(r.saldo_extrato))) + '</span>' +
        '</div>';
    }).join('');
    box.style.display = '';
  }catch(e){
    // nao e motivo para travar a tela: o quadro e informativo
    box.style.display = '';
    lista.innerHTML = '<div class="empty">Não consegui ler o histórico de conciliações: ' + esc(e.message) + '</div>';
  }
}

// ---------- registrar a conciliacao fechada ----------
async function registrarConciliacao(){
  if (!RES || !EXTRATO.length || !CONTA) return;
  const { de, ate } = janela();
  const saldoExtrato = valorBR(document.getElementById('cSaldoFim').value);
  if (isNaN(saldoExtrato)){ toast('✕ Preencha o saldo final do extrato','var(--red)','white'); return; }
  const base = (CONTA.data_base && CONTA.saldo_base != null)
             ? parseFloat(CONTA.saldo_base) : parseFloat(CONTA.saldo_inicial||0);
  const movAte = TXS.filter(t => t.date <= ate)
                    .reduce((s,t)=> s + (t.type==='income'?1:-1)*parseFloat(t.amount||0), 0);
  const saldoApp = base + movAte;
  const dif = saldoApp - saldoExtrato;
  const nSoB = RES.soBanco.length, nSoA = RES.soApp.length;
  let msg = 'Registrar a conciliação da ' + (CONTA.nome||CONTA.id) + '?\n\n' +
            'Extrato: ' + fmtDA(de) + ' a ' + fmtDA(ate) + '\n' +
            'Saldo do extrato: R$ ' + fmt(saldoExtrato) + '\n' +
            'Diferença: R$ ' + fmt(dif) + '\n' +
            'Casaram: ' + RES.pares.length + ' · sobraram ' + nSoB + ' no extrato e ' + nSoA + ' no app\n\n' +
            'O próximo extrato você baixa a partir de ' + fmtDA(recomeco(ate)) +
            ' — ' + SOBREPOE + ' dias antes do fim, de propósito, para pegar o que o banco postar com atraso.';
  if (nSoB || nSoA) msg += '\n\nAtenção: ainda há sobras. Registrar não resolve as sobras — só marca onde você parou.';
  if (!confirm(msg)) return;
  try{
    await sbIns('conciliacoes', [{
      conta_id: CONTA.id, extrato_ini: de, extrato_fim: ate,
      saldo_extrato: saldoExtrato, saldo_app: saldoApp, diferenca: dif,
      n_pares: RES.pares.length, n_so_banco: nSoB, n_so_app: nSoA,
      observacao: (nSoB || nSoA) ? (nSoB + ' no extrato e ' + nSoA + ' no app em aberto') : null
    }]);
    toast('✓ conciliação registrada até ' + fmtDA(ate));
    await carregaUltimas();
  }catch(e){ toast('✕ '+e.message,'var(--red)','white'); }
}

function onDrop(ev){
  ev.preventDefault(); ev.currentTarget.classList.remove('drag');
  const f = ev.dataTransfer.files[0]; if (f) lerArquivo(f);
}
function onFile(ev){ const f = ev.target.files[0]; if (f) lerArquivo(f); }

function lerArquivo(f){
  const r = new FileReader();
  r.onload = async e => {
    const { linhas, sep, periodo } = parseExtrato(e.target.result);
    if (!linhas.length) {
      document.getElementById('arqInfo').innerHTML =
        '<span style="color:var(--red)">Não achei lançamentos nesse arquivo. Esperava uma linha de cabeçalho com <b>Data</b> e <b>Valor</b>.</span>';
      return;
    }
    EXTRATO = linhas;
    PERIODO = periodo || null;
    const { de, ate } = janela();
    // o ultimo movimento pode ser dias antes do fim do extrato
    const ultMov = linhas.reduce((a,x)=> x.data > a ? x.data : a, linhas[0].data);
    document.getElementById('uzPh').innerHTML =
      `<div class="ubig">✅</div><div class="uprimary">${esc(f.name)}</div>` +
      `<div class="usub">${linhas.length} lançamentos · extrato de ${fmtDA(de)} a ${fmtDA(ate)}` +
      (PERIODO ? '' : ' <span style="color:var(--yellow)">(período deduzido dos lançamentos)</span>') +
      (PERIODO && ultMov < ate ? ` · último movimento em ${fmtD(ultMov)}` : '') +
      ` · separador "${sep}"</div>`;
    // o saldo da linha mais recente serve de palpite para o fechamento
    const ult = linhas.filter(x => x.data === ultMov && !isNaN(x.saldo));
    if (ult.length) document.getElementById('cSaldoFim').value = fmt(ult[0].saldo);
    document.getElementById('arqInfo').textContent = 'Lendo os lançamentos do app…';
    await rodar(de, ate);
  };
  r.readAsText(f, 'UTF-8');
}

async function rodar(de, ate){
  try{
    CONTA = CONTAS.find(c => c.id === document.getElementById('cConta').value);
    TXS = await sbGet('transactions', `account=eq.${encodeURIComponent(CONTA.id)}&date=gte.${de}&date=lte.${ate}&order=date.asc`);
    // os vinculos feitos a mao, da tabela — e o que ficou no navegador
    // antes da tabela existir sobe de uma vez
    MAO = await carregaMao(CONTA.id);
    try {
      const n = await importaMaoLocal(CONTA.id);
      if (n) toast('✓ ' + n + (n === 1 ? ' casamento' : ' casamentos') + ' do navegador movidos para o banco');
    } catch(e){ /* a importacao e cortesia; nao atrapalha a conciliacao */ }
    EXTRATO.forEach(b => delete b._ok);
    RES = casar(EXTRATO, montaCandidatos(TXS), TOL, JAN, maoDaConta());
    desenhar(de, ate);
    document.getElementById('resultado').style.display = '';
    document.getElementById('arqInfo').textContent = '';
  }catch(e){ toast('✕ '+e.message,'var(--red)','white'); document.getElementById('arqInfo').textContent=''; }
}

function desenhar(de, ate){
  // ---- fechamento ----
  const base = (CONTA.data_base && CONTA.saldo_base != null) ? parseFloat(CONTA.saldo_base) : parseFloat(CONTA.saldo_inicial||0);
  const db = CONTA.data_base || '2026-05-01';
  const extratoFim = valorBR(document.getElementById('cSaldoFim').value);
  const movAte = TXS.filter(t => t.date <= ate).reduce((s,t)=> s + (t.type==='income'?1:-1)*parseFloat(t.amount||0), 0);
  // o app parte da data_base; se o extrato comeca depois, preciso do que
  // veio entre as duas datas, que nao esta neste arquivo
  const calc = base + movAte;
  const dif = isNaN(extratoFim) ? NaN : (calc - extratoFim);

  document.getElementById('fechamento').innerHTML =
    `<div class="fbox"><div class="flab">O app calcula</div><div class="fval">R$ ${fmt(calc)}</div></div>
     <div class="fbox"><div class="flab">O extrato diz</div><div class="fval">${isNaN(extratoFim)?'—':'R$ '+fmt(extratoFim)}</div></div>
     <div class="fbox ${isNaN(dif)?'':(Math.abs(dif)<0.005?'ok':'bad')}"><div class="flab">Diferença</div><div class="fval">${isNaN(dif)?'—':'R$ '+fmt(dif)}</div></div>`;

  const parcial = db < de;
  document.getElementById('fechNota').innerHTML =
    `Saldo de partida de <b>R$ ${fmt(base)}</b> em ${fmtD(db)}, mais ${TXS.length} lançamentos do app até ${fmtD(ate)}.` +
    (parcial ? ` <span style="color:var(--yellow)">O extrato começa em ${fmtD(de)}, depois da data-base — então a diferença inclui o que aconteceu antes e não está neste arquivo.</span>` : '');

  // ---- listas ----
  // Nao escondo o que ja esta marcado como conciliado: some da lista e a
  // conta para de fechar. Quem ja foi conciliado antes aparece com selo.
  const P = RES.pares, SB_ = RES.soBanco, SA = RES.soApp;
  const somaB = SB_.reduce((s,x)=>s+x.valor,0), somaA = SA.reduce((s,x)=>s+x.valor,0);
  const impr = P.filter(p => p.nota !== 'exato');
  // o botao marca LANCAMENTOS, nao casamentos: um casamento pode levar
  // varias linhas do app (holerite, conta desdobrada). Os dois numeros
  // discordavam na tela — 98 casamentos, 118 lancamentos.
  const nLanc = P.reduce((s,p) => s + p.apps.reduce((t,a) => t + a.ids.length, 0), 0);

  // A sugestao do vizinho mais proximo do outro lado. Nao casa nada
  // sozinha: so mostra a distancia, para o olho decidir. A parcela do
  // financiamento de setembro esta no app com data de 10/out e R$ 0,21
  // de diferenca — longe demais para casar, obvia para quem olha.
  const dica = x => {
    const p = x._perto;
    if (!p || (p.dv > 5 && p.dd > 45)) return '';
    const partes = [];
    if (p.dv >= 0.005) partes.push('R$ ' + fmt(p.dv) + ' de diferença');
    if (p.dd) partes.push(p.dd + (p.dd === 1 ? ' dia' : ' dias') + ' de distância');

function reRodar(){
  const t = prompt('Tolerância em reais (hoje ' + TOL.toFixed(2) + '):', TOL.toFixed(2));
  if (t === null) return;
  const j = prompt('Janela de dias (hoje ' + JAN + '):', String(JAN));
  if (j === null) return;
  const tv = parseFloat(String(t).replace(',','.')), jv = parseInt(j, 10);
  if (!isNaN(tv)) TOL = Math.max(0, tv);
  if (!isNaN(jv)) JAN = Math.max(0, jv);
  const { de, ate } = janela();
  rodar(de, ate);
}

async function conciliarCasados(){
  const ids = [];
  RES.pares.forEach(p => p.apps.forEach(a => a.ids.forEach(i => ids.push(i))));
  if (!ids.length) return;
  if (!confirm('Marcar ' + ids.length + ' lançamentos como conciliados?\n\nIsso não muda valor nem categoria — só registra que bateram com o extrato.')) return;
  let ok = 0;

  toast('✓ ' + ok + ' conciliados');

}

// ---------- onde mora um casamento feito a mao ----------
// A tabela transactions so tem o 'reconciled', que diz "bateu" mas nao diz
// COM O QUE. Esse vinculo morava no localStorage, e localStorage e por
// NAVEGADOR: um casamento feito no Chrome do computador nao existia no
// iPhone, e a linha voltava para "falta lancar" do outro lado. Agora mora
// na tabela conciliacao_mao, com chave unica (conta_id, fp).
//
// MAO fica em memoria durante a rodada; a tabela e a verdade.
let MAO = {};
const MKEY = 'jr_conc_mao';            // so para a importacao do que ficou para tras
function mapaMaoLocal(){
  try { return JSON.parse(localStorage.getItem(MKEY) || '{}') || {}; } catch(e){ return {}; }
}
// Le da tabela e monta { fp: {ids, antes} } para o PASSE 0.
async function carregaMao(contaId){
  const linhas = await sbGet('conciliacao_mao',
    'select=fp,tx_ids,antes&conta_id=eq.' + encodeURIComponent(contaId) + '&limit=1000');
  const m = {};
  linhas.forEach(l => { m[l.fp] = { ids: l.tx_ids || [], antes: l.antes || [] }; });
  return m;
}
// Importacao unica do que foi casado antes da tabela existir. So sobe o que
// a tabela ainda nao tem — e nao apaga o localStorage, para o dado antigo
// continuar la caso algo de errado.
async function importaMaoLocal(contaId){
  const local = mapaMaoLocal()[contaId];
  if (!local) return 0;
  const faltam = Object.keys(local).filter(fp => !MAO[fp]);
  if (!faltam.length) return 0;
  const linhas = faltam.map(fp => ({
    conta_id: contaId, fp: fp,
    tx_ids: local[fp].ids || [],
    antes: local[fp].antes || (local[fp].ids || []).map(() => false)
  }));
  await sbUpsert('conciliacao_mao', linhas, 'conta_id,fp');
  linhas.forEach(l => { MAO[l.fp] = { ids: l.tx_ids, antes: l.antes }; });
  return linhas.length;
}
// Impressao digital da linha do extrato: o que nao muda entre dois
// downloads do mesmo periodo. Descricao normalizada e cortada, para o
// banco nao poder quebrar o vinculo mudando espaco ou acento.
function fpBanco(b){
  return b.data + '|' + Number(b.valor).toFixed(2) + '|' + normNome(b.desc).slice(0, 40);
}
function maoDaConta(){ return MAO || {}; }
// Grava na tabela e no mapa em memoria. Se a gravacao falhar, NAO mexe no
// mapa: melhor o par voltar na proxima rodada do que a tela mostrar um
// vinculo que o banco nao tem.
async function salvaMao(bl, ids, antes){
  if (!CONTA) return;
  const fp = fpBanco(bl);
  await sbUpsert('conciliacao_mao', [{
    conta_id: CONTA.id, fp: fp, tx_ids: ids.slice(), antes: antes.slice()
  }], 'conta_id,fp');
  MAO[fp] = { ids: ids.slice(), antes: antes.slice() };
}
async function apagaMao(bl){
  if (!CONTA) return null;
  const fp = fpBanco(bl), reg = MAO[fp] || null;
  await sbDel('conciliacao_mao',
    'conta_id=eq.' + encodeURIComponent(CONTA.id) + '&fp=eq.' + encodeURIComponent(fp));
  delete MAO[fp];
  return reg;
}

// ---------- casamento a mao ----------
// O botao antigo so marcava reconciled e sumia com a linha — ou seja,
// gravava no banco que ela bateu com o extrato quando ela nao bateu.
// Agora ele faz o que o nome diz: voce escolhe com qual linha do
// extrato aquele lancamento casa.
let CS = null;
function abrirCasar(i){
  CS = RES.soApp[i];

    '<br>Escolha a linha do extrato que corresponde a ele.';
  const opc = RES.soBanco
    .map((b, j) => ({ b, j, dv: Math.abs(b.valor - CS.valor), dd: dias(b.data, CS.data) }))
    .sort((x, y) => (x.dv * 100 + x.dd) - (y.dv * 100 + y.dd))
    .slice(0, 12);
  document.getElementById('csLista').innerHTML = opc.length
    ? opc.map(o => `<div class="lin"><span class="lin-d">${fmtD(o.b.data)}</span>` +
        `<span class="lin-t">${esc(o.b.desc||'—')}</span>` +

        `<button class="ico" onclick="casarCom(${o.j})">Casar</button></div>` +

          ? `<div class="sub2">${o.dv>=0.005?'R$ '+fmt(o.dv)+' de diferença':''}${o.dv>=0.005&&o.dd?' · ':''}${o.dd?o.dd+'d de distância':''}</div>`
          : '')).join('')
    : '<div class="empty">Não há linha do extrato sobrando para casar.</div>';
  document.getElementById('mdCasar').classList.add('on');
}
function fecharCasar(){ document.getElementById('mdCasar').classList.remove('on'); CS = null; }

// Um casamento a mao errado tem de ter volta, senao o erro fica gravado.
async function desfazerMao(i){
  const p = RES.pares[i];
  if (!p || String(p.nota).indexOf('à mão') !== 0) return;
  if (!confirm('Desfazer este casamento?\n\nAs duas pontas voltam para as listas. Os lançamentos que já estavam conciliados antes deste casamento continuam conciliados.')) return;
  let reg;
  try { reg = await apagaMao(p.bancos[0]); }
  catch(e){ toast('✕ não consegui apagar o vínculo: '+e.message,'var(--red)','white'); return; }
  // volta cada id ao estado anterior; quem ja era conciliado antes, fica
  for (const a of p.apps) {
    for (const id of a.ids) {
      const k = reg && reg.ids ? reg.ids.indexOf(id) : -1;
      const eraAntes = k >= 0 && reg.antes ? !!reg.antes[k] : false;
      if (!eraAntes) { try { await sbUpd('transactions', id, {reconciled:false}); } catch(e){} }
    }
  }
  toast('✓ casamento desfeito');
  const { de, ate } = janela();
  await rodar(de, ate);
}

async function casarCom(j){
  const bl = RES.soBanco[j], alvo = CS;
  if (!bl || !alvo) return;
  const dv = Math.abs(bl.valor - alvo.valor);
  if (dv >= 0.005 && !confirm('Os valores diferem em R$ ' + fmt(dv) +
      '.\n\nCasar assim registra que bateram, mas a diferença continua no saldo. Confirma?')) return;
  // guardo como cada id estava ANTES, para o desfazer nao apagar um
  // reconciled que ja vinha de outra rodada
  const antes = alvo.ids.map(id => {
    const t = TXS.find(x => x.id === id);
    return !!(t && t.reconciled);
  });
  // O vinculo vai PRIMEIRO. Se ele falhar, nao marco nada: um reconciled
  // sem vinculo e justamente o estado que fazia o par voltar com o selo
  // "ja conciliado" na rodada seguinte.
  try { await salvaMao(bl, alvo.ids, antes); }
  catch(e){ toast('✕ não consegui guardar o vínculo: '+e.message,'var(--red)','white'); return; }
  for (const id of alvo.ids) { try { await sbUpd('transactions', id, {reconciled:true}); } catch(e){} }
  RES.soApp = RES.soApp.filter(a => a !== alvo);
  RES.soBanco = RES.soBanco.filter(b => b !== bl);
  RES.pares.push({ bancos:[bl], apps:[alvo], nota: dv >= 0.005 ? 'à mão · difere R$ ' + fmt(dv) : 'à mão' });
  alvo.conciliado = true;
  fecharCasar();
  toast('✓ casado à mão');
  const { de, ate } = janela();
  desenhar(de, ate);
}

// Casa a descricao do extrato com um fornecedor que ja existe.
// Mesma normalizacao do autocomplete do lancamentos.html: sem acento,
// sem pontuacao, minusculo — assim "MARILDETE VALE SANTOS MEN" acha
// "Marildete Vale Santos".
function normNome(s){
  // ̀-ͯ sao os acentos que o NFD separa da letra. Escapado de
  // proposito: escrito com os caracteres crus fica invisivel no codigo.
  return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
// Mesma regra do marcaIR() do lancamentos.html: a marca vem da tabela de
// categorias, nao de um false fixo — senao uma despesa de Saude lancada
// daqui ficaria fora da deducao do IR sem ninguem notar.
function marcaDed(cat, sub){
  if (!cat || cat === 'transferencia') return false;
  const r = CATS.find(c => c.categoria === cat && String(c.subcategoria||'') === String(sub||''))
         || CATS.find(c => c.categoria === cat && !c.subcategoria);
  return !!(r && r.dedutivel);
}
function achaPayee(descBanco){
  const d = normNome(descBanco);
  if (!d) return '';
  // tira os prefixos que o banco carimba e nao fazem parte do nome
  const limpo = d.replace(/^(pix (enviado|recebido)|ted (recebida|enviada|conta salario)|debito (aut|autom|automatico|visa electron brasil)?\.?|pagamento de boleto( outros bancos)?|saque dinheiro( banco 24h| atm inter ag)?|debito aut fat cartao|operacoes credito imobiliario)\s*/,'').trim();
  const alvo = limpo || d;
  let melhor = null;
  PAYEES.forEach(p => {
    const n = normNome(p.name);
    if (!n) return;
    let pontos = 0;
    if (n === alvo) pontos = 100;
    else if (alvo.indexOf(n) === 0 || n.indexOf(alvo) === 0) pontos = 80;
    else if (alvo.indexOf(n) >= 0 || n.indexOf(alvo) >= 0) pontos = 60;
    else {
      // palavras em comum, ignorando as de uma ou duas letras
      const pa = alvo.split(' ').filter(w => w.length > 2);
      const pn = n.split(' ').filter(w => w.length > 2);
      const com = pa.filter(w => pn.indexOf(w) >= 0).length;
      if (com >= 2 || (com === 1 && pn.length === 1)) pontos = 30 + com * 10;
    }
    if (pontos && (!melhor || pontos > melhor.pontos)) melhor = { nome: p.name, pontos };
  });
  return melhor && melhor.pontos >= 40 ? melhor.nome : '';
}
function lcDica(){
  const v = document.getElementById('lcDesc').value.trim();
  const el = document.getElementById('lcPayHint');
  if (!v) { el.textContent = ''; return; }
  const existe = PAYEES.some(p => normNome(p.name) === normNome(v));
  el.innerHTML = existe

}

             '<b>saída</b> na conta escolhida, que é de onde o dinheiro veio.');

async function lancarConfirma(){
  if (!LC) return;
  const cat = document.getElementById('lcCat').value;
  if (!cat) { toast('✕ Escolha a categoria','var(--red)','white'); return; }
  const sub = document.getElementById('lcSub2').value || null;
  const desc = document.getElementById('lcDesc').value.trim() || 'Ajuste de conciliação';
  const data = document.getElementById('lcData').value;
  const v = Math.abs(LC.valor);
  const tipo = LC.valor >= 0 ? 'income' : 'expense';
  const dest = document.getElementById('lcDest').value;
  if (cat === 'transferencia' && !dest) { toast('✕ Escolha a conta de destino','var(--red)','white'); return; }
  try{
    const gid = Date.now();
    let linhas;
    if (cat === 'transferencia') {
      // Mesmo molde da aba Transferencia do lancamentos.html: a perna de
      // ORIGEM leva o texto digitado e a de DESTINO leva 'Transferencia de
      // <origem>'. Quem e origem depende do sinal da linha do extrato:
      // debito  -> esta conta e a origem;
      // credito -> esta conta e o DESTINO (o dinheiro veio da outra).
      // A versao anterior nomeava sempre a outra perna como vinda desta
      // conta, o que inverte o credito.
      const nomeAqui = CONTA.nome || CONTA.id;
      const nomeLa   = (CONTAS.find(c => c.id === dest) || {}).nome || dest;
      const debito   = LC.valor < 0;
      const origemId = debito ? CONTA.id : dest;
      const destinoId= debito ? dest : CONTA.id;
      const nomeOrig = debito ? nomeAqui : nomeLa;
      const base = { amount: v, date: data, category: 'transferencia', subcategory: null,
                     is_deductible: false, receipt_status: 'na',
                     installments: 1, installment_num: 1, from_recorrente: false };
      // id+99999 e o mesmo afastamento do lancamentos.html — gid+1
      // colidiria com o Date.now() do milissegundo seguinte.
      const idSai = gid, idEnt = gid + 99999;
      linhas = [
        Object.assign({}, base, {
          id: idSai, group_id: idSai, type: 'expense', account: origemId,
          payee: debito ? desc : ('Transferência para ' + nomeAqui),
          payee_display: debito ? desc : ('Transf. para ' + nomeAqui),
          memo: 'Conciliação bancária · saída da transferência',
          reconciled: debito
        }),
        Object.assign({}, base, {
          id: idEnt, group_id: idEnt, type: 'income', account: destinoId,
          payee: 'Transferência de ' + nomeOrig,
          payee_display: 'Transf. de ' + nomeOrig,
          memo: 'Conciliação bancária · entrada da transferência',
          reconciled: !debito
        })
      ];
    } else {
      linhas = [{
        id: gid, group_id: gid, type: tipo, amount: v, date: data,
        payee: desc, payee_display: desc, account: CONTA.id,
        category: cat, subcategory: sub,
        memo: 'Conciliação bancária · lançado a partir do extrato',
        is_deductible: marcaDed(cat, sub), receipt_status: 'na', reconciled: true,
        installments: 1, installment_num: 1, from_recorrente: false
      }];
    }
    await sbIns('transactions', linhas);
    // fornecedor novo entra na base, para o autocomplete das outras telas
    if (cat !== 'transferencia' && desc && !PAYEES.some(p => normNome(p.name) === normNome(desc))) {
      try{
        await sbIns('payees', [{ name: desc, category: cat, subcategory: sub, use_count: 1, last_used: data }]);
        PAYEES.push({ name: desc });
      }catch(e){ /* fornecedor duplicado nao impede o lancamento */ }
    }
    toast(cat === 'transferencia' ? '✓ Lançado nas duas contas' : '✓ Lançado');
    fecharLancar();
    const { de, ate } = janela();
    await rodar(de, ate);
  }catch(e){ toast('✕ '+e.message,'var(--red)','white'); }
}

// ---------- entrada ----------
document.addEventListener('DOMContentLoaded', function(){
  var e = document.getElementById('appVer'); if (e) e.textContent = APP_VERSION;
  document.getElementById('mdLancar').addEventListener('click', function(ev){ if (ev.target === this) fecharLancar(); });
  document.getElementById('mdCasar').addEventListener('click', function(ev){ if (ev.target === this) fecharCasar(); });
  document.getElementById('cSaldoFim').addEventListener('change', function(){
    if (RES) { const { de, ate } = janela(); desenhar(de, ate); }
  });
  JRAuth.protege(function(){ carregar(); });
});
</script>
